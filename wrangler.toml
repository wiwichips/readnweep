name = "readnweep"
main = "src/worker.py"
compatibility_date = "2026-02-14"
compatibility_flags = ["python_workers"]

assets = { directory = "public", binding = "ASSETS", run_worker_first = true }

# Enable Workers Logs (Observability)
[observability]
enabled = true
head_sampling_rate = 1

# D1 database binding (SQLite). Fill in IDs from `wrangler d1 create`.
[[d1_databases]]
binding = "DB"
database_name = "readnweep-db"
database_id = "99ffa424-f2a7-45ee-9090-41fcf06257ba"
migrations_dir = "migrations"

# Optional KV binding for persistence. If you add this, also add the IDs from `wrangler kv:namespace create`.
# [[kv_namespaces]]
# binding = "STORE"
# id = "your-kv-id"
# preview_id = "your-kv-preview-id"
