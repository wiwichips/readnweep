<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Read It and Weep</title>
  </head>
  <body>
    <h1>Read It and Weep</h1>
    <p>Upload a photo and get the IP of whoever clicks on it!</p>

    <form id="upload-form">
      <input id="file-input" type="file" name="file" accept="image/*" required />
      <button type="submit">Upload</button>
    </form>

    <div id="status"></div>
    <div id="result"></div>

    <script src="/app.js"></script>
  </body>
</html>
